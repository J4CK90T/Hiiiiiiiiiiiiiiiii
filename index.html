<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a little question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Bokeh background, drifts behind everything -->
  <div class="bokeh" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- Start overlay: browsers block autoplay audio until a real click happens -->
  <div id="overlay-start" class="overlay">
    <div class="overlay-inner">
      <p class="eyebrow">before we start</p>
      <button id="btn-start" class="btn btn-yes">Press play</button>
    </div>
  </div>

  <main id="app">

    <section id="scene-ask" class="scene">
      <h1 class="script">Hey&nbsp;you,<br>will you go out with me?</h1>
      <div class="button-row">
        <button id="btn-yes" class="btn btn-yes" type="button">Yes</button>
        <button id="btn-no" class="btn btn-no" type="button">No</button>
      </div>
    </section>

    <section id="scene-yay" class="scene">
      <h1 class="script big" id="yay-text">YAAAAAAAAAY</h1>
    </section>

    <section id="scene-date" class="scene">
      <h2 class="script">Pick a date</h2>
      <input type="date" id="date-input" class="field">
      <button id="btn-date-next" class="btn btn-yes" type="button" disabled>Next</button>
    </section>

    <section id="scene-meal" class="scene">
      <h2 class="script">What do you want to eat?</h2>
      <input type="text" id="meal-input" class="field" placeholder="type a meal..." autocomplete="off">
      <button id="btn-submit" class="btn btn-yes" type="button">Okay</button>
      <p id="submit-status" class="status"></p>
    </section>

    <section id="scene-bye" class="scene">
      <h1 class="script">Okay 💛</h1>
      <p class="sub">See you soon. Goodbye!</p>
    </section>

  </main>

  <audio id="bg-music" src="assets/music.mp3" loop preload="auto"></audio>

  <script src="js/script.js"></script>
</body>
</html>
